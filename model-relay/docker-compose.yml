services:
  model-relay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # 运行时将本地 config.yaml 挂载进容器，方便调整模型目录而无需重建镜像
      - ./config.yaml:/app/config.yaml:ro
      # SQLite 数据目录（Key、记账明细），不挂载则容器重建后数据丢失
      - ./data:/app/data
    environment:
      - MODEL_RELAY_LOG_LEVEL=info
      - MODEL_RELAY_CONFIG_PATH=/app/config.yaml
      # 管理 API 鉴权 Key（必改）
      - MODEL_RELAY_ADMIN_KEY=sk-admin-change-me
      # 上游厂商 API Key（与 config.yaml 的 api_key_env 对应，按需填写）
      - OPENAI_API_KEY=
      - DEEPSEEK_API_KEY=
